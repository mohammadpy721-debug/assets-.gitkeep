name: Daily quote

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick today's quote
        run: |
          python3 - <<'PY'
          import json, datetime, re
          quotes = json.load(open("quotes.json", encoding="utf-8"))
          q = quotes[datetime.date.today().toordinal() % len(quotes)]
          block = f'> "{q["text"]}"\n>\n> — *{q["author"]}*'
          p = "README.md"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"<!-- QUOTE:START -->.*?<!-- QUOTE:END -->",
                     f"<!-- QUOTE:START -->\n{block}\n<!-- QUOTE:END -->", s, flags=re.S)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update daily quote" && git push)
